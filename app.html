<style>
  /* Layout: رأس (العنوان، التاريخ، التقدم، الإضافة) ثم لوحة بثلاثة أعمدة: مهام اليوم / قيد التنفيذ / منجزة.
     تصميم فاتح بالكامل بناءً على طلب المستخدم (خلفية فاتحة نظيفة). */
  :root {

  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }

  .input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

const dailyWord = () => DAILY_WORDS[Math.floor(fromIso(today()).getTime() / 864e5) % DAILY_WORDS.length];
const LOCALE = 'ar-OM-u-nu-latn-ca-gregory';
const fmtLong = s => new Intl.DateTimeFormat(LOCALE, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(fromIso(s));
const fmtShort = s => new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'long' }).format(fromIso(s));
function fmtDue(s) {
  const t = today();
  if (s === t) return 'اليوم';
  if (s === addDays(t, 1)) return 'غداً';
  if (s === addDays(t, -1)) return 'أمس';
  return fmtShort(s);
}
const fmtDay = s => new Intl.DateTimeFormat(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }).format(fromIso(s));
const fmtWeekday = s => new Intl.DateTimeFormat(LOCALE, { weekday: 'long' }).format(fromIso(s));
const fmtDayMonth = s => new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'long' }).format(fromIso(s));
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
// بداية الأسبوع (الأحد) مع إزاحة بالأسابيع
// أسبوع الدوام من الأحد إلى الخميس؛ في الجمعة والسبت يكون «هذا الأسبوع» هو الأسبوع القادم
const weekStart = (offset = 0) => { const g = fromIso(today()).getDay(); return addDays(today(), -g + (g >= 5 ? 7 : 0) + 7 * offset); };
const weekDays = offset => Array.from({ length: 5 }, (_, i) => addDays(weekStart(offset), i));
const weekOf = d => Math.floor(diffDays(weekStart(0), d) / 7);
function fmtTime(t) {
  const [h, m] = t.split(':').map(Number);

}

// ---------- نقل بيانات الإصدار السابق (مهام مرتبطة بيوم وفترة) ----------
function migrateV1() {
  if (store.get('shp:v2:migrated', false)) return;
  try {
    const bySchool = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const m = key && key.match(/^shp:v1:([^:]+):(\d{4}-\d{2}-\d{2})$/);
      if (!m) continue;
      const [, school, date] = m;
      (JSON.parse(localStorage.getItem(key)) || []).forEach(t => {
        const done = t.status === 'done';
        (bySchool[school] = bySchool[school] || []).push({
          id: t.id || uid(), type: t.type || 'custom', title: t.title || '',
          desc: [t.time ? `الوقت: ${fmtTime(t.time)}` : '', t.note].filter(Boolean).join(' · '),
          grades: t.grades || [], priority: 'normal', due: date,
          status: done ? 'done' : 'today', prevStatus: 'today', doneAt: done ? date : null,
          created: t.created || Date.now(),
        });
      });
    }
    Object.entries(bySchool).forEach(([school, list]) => store.set(tasksKey(school), [...store.get(tasksKey(school), []), ...list]));
    const old = JSON.parse(localStorage.getItem('shp:v1:prefs') || '{}');
    if (old.school || old.preparer) store.set(PREFS_KEY, { ...store.get(PREFS_KEY, {}), ...old });
  } catch {}
  store.set('shp:v2:migrated', true);
}
migrateV1();

const prefs = store.get(PREFS_KEY, {});
const state = {

const load = () => { state.tasks = store.get(tasksKey(state.school), []); };

// مهام اليوم = غير المنجزة المستحقة اليوم أو المتأخرة + ما أُنجز اليوم
function todayScope() {
  const t = today();
  return state.tasks.filter(x => x.status === 'done' ? x.doneAt === t : (x.due || t) <= t);
}
function stats() {
  const scope = todayScope();
  const done = scope.filter(x => x.status === 'done').length;
  return { total: scope.length, done, left: scope.length - done, pct: scope.length ? Math.round((done / scope.length) * 100) : 0 };
}
function columnTasks(key, list = state.tasks) {
  const items = list.filter(t => t.status === key && !isUpcoming(t));
  if (key === 'done') return items.sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '') || b.created - a.created);
  return items.sort((a, b) => prioOf(a).rank - prioOf(b).rank || (a.due || '').localeCompare(b.due || '') || a.created - b.created);
}

        <button class="check ${done ? 'on' : ''}" data-action="toggle" role="checkbox" aria-checked="${done}" aria-label="${done ? 'إلغاء الإتمام' : 'إتمام المهمة'}"><i data-lucide="check"></i></button>
        <div class="min-w-0 flex-1">
          <div class="flex items-start gap-2">
            <p class="t-title flex-1 min-w-0">${esc(titleOf(t))}</p>
            <div class="flex items-center -mt-1 -ms-1">
              <button class="icon-btn" data-action="edit" aria-label="تعديل المهمة"><i data-lucide="pencil"></i></button>
              ${state.pendingDelete === t.id
                ? `<button class="confirm-del" data-action="delete-confirm">تأكيد الحذف</button>`
                : `<button class="icon-btn danger" data-action="delete" aria-label="حذف المهمة"><i data-lucide="trash-2"></i></button>`}
            </div>
          </div>
          <div class="t-body">
            ${t.desc ? `<p class="t-desc mt-0.5">${esc(t.desc)}</p>` : ''}
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-2.5">
              <span class="pill" style="background:${P.bg};color:${P.fg}">${P.label}</span>
              ${t.due ? `<span class="meta num ${late ? 'late' : ''}"><i data-lucide="calendar-clock"></i>${late ? 'متأخرة · ' : ''}${esc(fmtDue(t.due))}</span>` : ''}
              ${t.type !== 'custom' ? `<span class="meta" style="color:${T.color}"><i data-lucide="${T.icon}"></i>${T.label}</span>` : ''}
            </div>
            ${grades.length ? `<div class="flex flex-wrap gap-1 mt-2">${grades.map(g => `<span class="chip">${gradeName(g)}</span>`).join('')}</div>` : ''}
          </div>
          ${t.status === 'today' && !isUpcoming(t) ? `<div class="mt-2"><button class="move" data-action="move" data-to="progress"><i data-lucide="arrow-left"></i>نقل إلى قيد التنفيذ</button></div>` : ''}
          ${t.status === 'progress' ? `<div class="mt-2"><button class="move" data-action="move" data-to="today"><i data-lucide="undo-2"></i>إعادة إلى مهام اليوم</button></div>` : ''}
        </div>
      </div>
    </li>`;
}

// ---------- نافذة الإضافة والتعديل ----------
const modalRoot = document.getElementById('modal-root');
let draft = null, formError = '', confirmAction = null;

function openForm(task) {
  draft = JSON.parse(JSON.stringify(task));
  formWeek = weekOf(draft.due || today());
  formError = '';
  renderForm();
  setTimeout(() => modalRoot.querySelector('#f-title')?.focus(), 30);
}

function renderForm() {
  const T = TYPES[draft.type];
  const isEdit = state.tasks.some(t => t.id === draft.id);
  const mode = schoolGrades().length ? T.grades : 'none';
  const statuses = isEdit ? ['today', 'progress', 'done'] : ['today', 'progress'];
  modalRoot.innerHTML = `
    <div class="overlay" data-action="close-overlay">
      <form id="task-form" class="sheet max-w-lg p-5 sm:p-6 flex flex-col gap-4" novalidate>
        <div class="flex items-center gap-3">
          <h2 class="text-xl font-bold flex-1">${isEdit ? 'تعديل المهمة' : 'إضافة مهمة'}</h2>
          <button type="button" class="icon-btn" data-action="close" aria-label="إغلاق"><i data-lucide="x"></i></button>
        </div>

        <div>
          <label class="lbl" for="f-title">${T.titleLabel}</label>
          <input id="f-title" class="input" value="${esc(draft.title)}" placeholder="${esc(T.ph)}" autocomplete="off">
          ${T.suggestions ? `<div class="flex flex-wrap gap-2 mt-2">${T.suggestions.map(s => `<button type="button" class="sugg" data-action="sugg" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        </div>

        <div>
          <label class="lbl" for="f-desc">وصف قصير (اختياري)</label>
          <textarea id="f-desc" class="input" rows="2" placeholder="تفاصيل تساعدك على تنفيذ المهمة">${esc(draft.desc)}</textarea>
        </div>

        <fieldset>
          <legend class="lbl">الأولوية</legend>
          <div class="flex gap-2">
            ${Object.entries(PRIORITIES).map(([k, P]) => `
              <label class="pchip" style="--pbg:${P.bg};--pfg:${P.fg}">
                <input type="radio" name="priority" value="${k}" ${draft.priority === k ? 'checked' : ''}>
                <span>${P.label}</span>
              </label>`).join('')}

        <fieldset>
          <legend class="lbl">يوم المهمة</legend>
          <div id="f-days">${dayStrip()}</div>
        </fieldset>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="lbl" for="f-due">تاريخ الاستحقاق (أو اختر أي تاريخ)</label>
            <input id="f-due" type="date" class="input num" value="${esc(draft.due)}">
            <p id="f-due-hint" class="text-xs font-semibold mt-1.5" style="color:#6d28d9" ${draft.due > today() && draft.status === 'today' ? '' : 'hidden'}>ستظهر في «خطة الأسبوع» تحت يومها، ثم تنتقل إلى «مهام اليوم» في موعدها.</p>
          </div>
          <div>
            <label class="lbl" for="f-type">التصنيف</label>
            <select id="f-type" class="input">
              ${TYPE_ORDER.map(k => `<option value="${k}" ${k === draft.type ? 'selected' : ''}>${TYPES[k].label}</option>`).join('')}
            </select>
          </div>
        </div>

        ${mode !== 'none' ? `
          <fieldset>
            <legend class="lbl">${mode === 'single' ? 'الصف المستهدف' : mode === 'multi' ? 'الصفوف المستهدفة (يمكن اختيار أكثر من صف)' : 'الصفوف المستهدفة (اختياري)'}</legend>
            <div class="flex flex-wrap gap-2">

                  <input type="${mode === 'single' ? 'radio' : 'checkbox'}" name="grade" value="${g}" ${draft.grades.includes(+g) ? 'checked' : ''}>

        <fieldset>
          <legend class="lbl">الحالة</legend>
          <div class="seg">
            ${statuses.map(k => `<label><input class="sr-only" type="radio" name="status" value="${k}" ${draft.status === k ? 'checked' : ''}><span>${COLUMNS[k].label}</span></label>`).join('')}

let formWeek = 0;
function dayStrip() {
  const due = modalRoot.querySelector('#f-due')?.value || draft.due;
  const days = weekDays(formWeek);
  const label = d => d === today() ? 'اليوم' : d === addDays(today(), 1) ? 'غداً' : fmtWeekday(d);
  return `
    <div class="flex items-center gap-1">
      <button type="button" class="icon-btn" data-action="fweek" data-n="-1" aria-label="الأسبوع السابق"><i data-lucide="chevron-right"></i></button>
      <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5 flex-1">
        ${days.map(d => `<button type="button" class="dchip ${d === due ? 'on' : ''}" data-action="day-pick" data-d="${d}"><b>${label(d)}</b><small class="num">${esc(fmtDayMonth(d))}</small></button>`).join('')}
      </div>
      <button type="button" class="icon-btn" data-action="fweek" data-n="1" aria-label="الأسبوع التالي"><i data-lucide="chevron-left"></i></button>
    </div>`;
}
function refreshDayStrip() {
  const box = modalRoot.querySelector('#f-days');
  if (box) { box.innerHTML = dayStrip(); refreshIcons(); }
  updateDueHint();
}

function readForm() {
  const f = modalRoot.querySelector('#task-form');
  if (!f) return;
  draft.title = f.querySelector('#f-title').value;
  draft.desc = f.querySelector('#f-desc').value;
  draft.due = f.querySelector('#f-due').value;
  draft.priority = (f.querySelector('input[name=priority]:checked') || {}).value || 'normal';
  draft.status = (f.querySelector('input[name=status]:checked') || {}).value || 'today';
  draft.grades = [...f.querySelectorAll('input[name=grade]:checked')].map(i => +i.value);
}

function validate() {
  const T = TYPES[draft.type];
  if (!T.defaultTitle && !draft.title.trim()) return `اكتب ${T.titleLabel.replace(' (اختياري)', '')}.`;
  const noGrades = !schoolGrades().length;
  if (!noGrades && T.grades === 'single' && draft.grades.length !== 1) return 'اختر الصف المستهدف للمحاضرة.';
  if (!noGrades && T.grades === 'multi' && draft.grades.length === 0) return 'اختر صفاً واحداً على الأقل للفحص الشامل.';
  if (!draft.due) return 'اختر تاريخ الاستحقاق.';
  return '';
}

function closeModal() { modalRoot.innerHTML = ''; draft = null; confirmAction = null; clearTimeout(renderTimer); rendered = null; }

// إنفوجرافيك الأسبوع بأسلوب الملصق للمدرستين والبرنامج معاً
function weekPosterHTML() {

  const all = data.flatMap(sc => sc.tasks.map(t => ({ ...t, tag: sc.tag })));
  const done = all.filter(t => t.status === 'done').length;

          <div class="p-thin" style="margin:14px 0"></div>
          <div class="p-note">أكثر الأيام ازدحاماً: <b style="color:#48484a">${esc(fmtWeekday(busiest))}</b> بعدد <span class="num">${byDay(busiest).length}</span> مهام</div>
        </div>
        <div style="width:2px;background:#cfc5b8"></div>
        <div style="flex:1">
          <div class="p-big num" style="color:#e2725b">${pct}<small>%</small></div>
          <div class="p-cap dark">من مهام الأسبوع<br>منجزة حتى الآن</div>
          <div class="p-bar" style="height:12px;margin-top:14px"><i style="width:${pct}%"></i></div>
          <div class="p-note" style="margin-top:8px"><span class="num">${done}</span> منجزة · <span class="num">${all.length - done}</span> متبقية</div>
        </div>
      </div>

      <div class="p-rule" style="margin:24px 0 18px"></div>
      <div class="p-h">التوزيع حسب الجهة</div>
      <div class="p-row" style="margin-top:12px;gap:20px">
        ${data.map(sc => { const d = sc.tasks.filter(t => t.status === 'done').length; return `
          <div class="p-ent">
            <b class="num">${sc.tasks.length}</b>
            <span>${esc(sc.name)}</span>

          <div class="p-h">أنواع المهام</div>
          <div style="display:flex;flex-wrap:wrap;gap:14px 6px;margin-top:14px">

              <div class="p-type">
                <span class="ring"><i data-lucide="${x.T.icon}"></i></span>
                <b class="num">${x.n}</b>
                <small>${x.T.label}</small>
              </div>`).join('') : '<div class="p-note">لا توجد مهام هذا الأسبوع.</div>'}
          </div>
        </div>
        <div style="flex:1">
          <div class="p-h dark">الأولوية</div>
          ${prio.map(P => `
            <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
              <span class="p-dot" style="background:${P.fg};width:14px;height:14px"></span>

              <div class="p-bar" style="flex:1;margin:0"><i style="width:${all.length ? Math.round((P.n / all.length) * 100) : 0}%;background:${P.fg}"></i></div>
              <b class="num" style="font-size:20px;font-weight:900;width:28px;text-align:center">${P.n}</b>
            </div>`).join('')}
          ${gradesAll.length ? `<div class="p-note" style="margin-top:16px">الصفوف المستهدفة: ${gradesAll.map(g => GRADES[g]).join('، ')}</div>` : ''}

      ${top ? `
        <div class="p-coral" style="margin-top:26px">
          <div class="p-cap" style="font-size:16px">أهم مهمة هذا الأسبوع</div>
          <div style="font-size:32px;font-weight:900;line-height:1.35;margin-top:2px">«${esc(titleOf(top))}»</div>

          <div class="p-tasks">
            ${list.length ? list.map(t => `
              <span class="p-task ${t.status === 'done' ? 'done' : ''}">
                <span class="p-dot" style="background:${t.status === 'done' ? '#9a928a' : prioOf(t).fg}"></span>${esc(titleOf(t))}<em>${esc(t.tag)}</em>
              </span>`).join('') : '<span class="p-note">لا توجد مهام</span>'}
          </div>

      <div class="p-rule" style="margin:16px 0 12px"></div>

        <span>المعدّ: <span id="ig-preparer-out">${esc(state.preparer.trim() || '—')}</span></span>

}

// جدول أسبوعي يجمع المدرستين: صف لكل يوم وعمود لكل مدرسة
function weekReportHTML() {
  const days = weekDays(weekOffset);
  const data = SCHOOLS.map(sc => ({ ...sc, tasks: sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []) }));
  const forDay = (sc, d) => sc.tasks.filter(t => t.due === d)
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || prioOf(a).rank - prioOf(b).rank || a.created - b.created);
  const shown = days;
  const all = data.flatMap(sc => sc.tasks.filter(t => days.includes(t.due)));
  const done = all.filter(t => t.status === 'done').length;
  const cell = (sc, d) => {
    const list = forDay(sc, d);
    if (!list.length) return `<div class="wk-none">—</div>`;
    return list.map(t => {
      const T = typeOf(t), P = prioOf(t), isDone = t.status === 'done';
      const grades = (t.grades || []).slice().sort((a, b) => a - b).map(gradeName).join('، ');
      return `
        <div class="wk-item">
          <span class="wk-dot" style="background:${isDone ? '#15803d' : P.fg}"></span>
          <div style="min-width:0">
            <div class="wk-title" style="${isDone ? 'color:#66727f' : ''}">${isDone ? '✓ ' : ''}${esc(titleOf(t))}</div>
            <div class="wk-meta">${esc([T.label, grades].filter(Boolean).join(' · '))}</div>
          </div>
        </div>`;
    }).join('');
  };
  return `
    <div id="infographic" class="ig-week" dir="rtl" lang="ar">
      <div class="ig-head">
        <div style="min-width:0">
          <div class="ig-sub" style="font-weight:600">الخطة الأسبوعية · الصحة المدرسية</div>
          <div class="ig-title">جدول الأسبوع للمدرستين والبرنامج</div>
          <div class="ig-sub num" style="margin-top:4px">${esc(fmtDayMonth(days[0]))} – ${esc(fmtDayMonth(days[4]))} ${fromIso(days[4]).getFullYear()}</div>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:34px;font-weight:700;line-height:1.1" class="num">${all.length}</div>
          <div class="ig-sub" style="font-weight:600">مهمة · <span class="num">${done}</span> منجزة</div>
        </div>
      </div>
      <div class="ig-body">
        <div class="wk-grid" style="grid-template-columns: 120px repeat(${data.length}, minmax(0, 1fr))">
          <div class="wk-th">اليوم</div>
          ${data.map(sc => `<div class="wk-th">${esc(sc.name)}</div>`).join('')}
          ${shown.map(d => `
            <div class="wk-day${d === today() ? ' wk-today' : ''}"><b>${esc(fmtWeekday(d))}</b><small class="num">${esc(fmtDayMonth(d))}</small></div>
            ${data.map(sc => `<div class="wk-cell${d === today() ? ' wk-today' : ''}">${cell(sc, d)}</div>`).join('')}`).join('')}
        </div>
        <div class="wk-legend">
          ${Object.values(PRIORITIES).map(P => `<span><span class="wk-dot" style="background:${P.fg}"></span>${P.label}</span>`).join('')}
          <span><span class="wk-dot" style="background:#15803d"></span>منجزة</span>
        </div>
      </div>
      <div class="ig-foot">
        <span>المعدّ: <span id="ig-preparer-out">${esc(state.preparer.trim() || '—')}</span></span>
        <span class="num">${all.length ? Math.round((done / all.length) * 100) : 0}% من مهام الأسبوع منجزة</span>
      </div>
    </div>`;
}

function openConfirm(title, text, okLabel, onOk) {
  confirmAction = onOk;
  modalRoot.innerHTML = `
    <div class="overlay" data-action="close-overlay">
      <div class="sheet max-w-sm p-5 sm:p-6 flex flex-col gap-3" role="alertdialog" aria-labelledby="cf-title">
        <h2 id="cf-title" class="text-lg font-bold">${title}</h2>
        <p class="muted">${text}</p>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" class="btn" data-action="close">إلغاء</button>
          <button type="button" class="btn btn-danger" data-action="confirm-ok">${okLabel}</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => modalRoot.querySelector('[data-action=close]')?.focus(), 30);
}

function setStatus(t, status) {
  if (status === 'done' && t.status !== 'done') { t.prevStatus = t.status; t.doneAt = today(); }
  if (status !== 'done') t.doneAt = null;
  t.status = status;
}

function updateDueHint() {
  const due = modalRoot.querySelector('#f-due')?.value;
  const status = (modalRoot.querySelector('input[name=status]:checked') || {}).value;
  const hint = modalRoot.querySelector('#f-due-hint');
  if (hint) hint.hidden = !(due && due > today() && status === 'today');
}

modalRoot.addEventListener('change', e => {
  if (draft && e.target.id === 'f-due' && e.target.value) { formWeek = weekOf(e.target.value); refreshDayStrip(); }
  if (draft && e.target.name === 'status') updateDueHint();
  if (!draft || e.target.id !== 'f-type') return;
  readForm();
  draft.type = e.target.value;
  const mode = TYPES[draft.type].grades;
  if (mode === 'none') draft.grades = [];
  if (mode === 'single') draft.grades = draft.grades.slice(0, 1);
  formError = '';
  renderForm();
});

modalRoot.addEventListener('submit', e => {
  if (e.target.id !== 'task-form') return;
  e.preventDefault();
  readForm();
  formError = validate();
  if (formError) { renderForm(); return; }
  const existing = state.tasks.find(x => x.id === draft.id);
  const t = { ...draft, title: draft.title.trim(), desc: draft.desc.trim() };
  if (existing) {
    const status = t.status;
    t.status = existing.status; t.doneAt = existing.doneAt; t.prevStatus = existing.prevStatus;
    setStatus(t, status);
    state.tasks[state.tasks.indexOf(existing)] = t;
    toast('تم حفظ التعديلات');
  } else {
    state.tasks.push(t);

// نجهّز الصورة في الخلفية فور فتح نافذة التصدير، فيكون الحفظ فورياً عند الضغط
let rendered = null, renderTimer = 0;
function prerender(delay = 300) {
  rendered = null;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { rendered = renderCard(); rendered.catch(() => { rendered = null; }); }, delay);
}
async function renderCard() {
  const card = document.getElementById('infographic');
  if (!card || !window.html2canvas) throw new Error('no-tool');
  card.querySelectorAll('svg.lucide').forEach(svg => svg.setAttribute('stroke', getComputedStyle(svg).color));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  card.classList.add('capturing');
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false })
    .finally(() => card.classList.remove('capturing'));
  const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
  return { card, blob, url: URL.createObjectURL(blob) };
}

async function generateImage() {
  const out = document.getElementById('ig-image-out');
  if (!window.html2canvas) { toast('تعذر تحميل أداة إنشاء الصور'); return; }
  clearTimeout(renderTimer);
  const card = document.getElementById('infographic');
  if (!rendered) rendered = renderCard();
  let img;
  try {
    img = await rendered;
    if (img.card !== card) { rendered = renderCard(); img = await rendered; }
  } catch {
    rendered = null;
    toast('تعذر إنشاء الصورة، حاول مرة أخرى');
    return;
  }
  let saved = false;
  const downloads = await downloadsReady;
  if (downloads) {
    try {
      await downloads.save({ filename: exportName, data: img.blob });
      saved = true; toast('تم حفظ الصورة');
    } catch (err) {
      toast(err?.code === 'declined' ? 'تم إلغاء الحفظ' : 'تعذر الحفظ المباشر، احفظ الصورة أدناه يدوياً');
    }
  }
  if (!inFrame) {
    const a = document.createElement('a');
    a.href = img.url; a.download = exportName;
    document.body.appendChild(a); a.click(); a.remove();
    saved = true; toast('تم حفظ الصورة');
  }
  out.hidden = false;
  out.innerHTML = `
    <p class="text-sm font-semibold muted mb-2">${saved ? 'تم حفظ الصورة. يمكنك أيضاً حفظ النسخة أدناه يدوياً.'
      : 'الصورة جاهزة: اضغط عليها مطولاً (في الجوال) أو انقر بالزر الأيمن واختر «حفظ الصورة».'}</p>
    <img src="${img.url}" alt="بطاقة التصدير" style="width:100%;max-width:520px;border-radius:14px;border:1px solid var(--line)">`;
}

const hasPin = () => !!store.get(PIN_KEY, null);
async function hashPin(pin) {
  const text = 'shp-pin:' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'f' + (h >>> 0).toString(16);
  }
}

function exportData() {
  const tasks = {};
  SCHOOLS.forEach(sc => { tasks[sc.id] = sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []); });
  return JSON.stringify({ app: 'school-health-planner', v: 2, at: new Date().toISOString(), preparer: state.preparer, tasks });
}

function importData(text) {
  let data;
  try { data = JSON.parse(text.trim()); } catch { return 'النص ليس نسخة احتياطية صحيحة. تأكد أنك نسخته كاملاً.'; }
  if (!data || data.app !== 'school-health-planner' || typeof data.tasks !== 'object') return 'هذه ليست نسخة احتياطية من هذا التطبيق.';
  let added = 0, updated = 0;
  SCHOOLS.forEach(sc => {
    const incoming = Array.isArray(data.tasks[sc.id]) ? data.tasks[sc.id] : [];
    const current = sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []);
    const byId = new Map(current.map(t => [t.id, t]));
    incoming.forEach(t => { if (!t || !t.id) return; byId.has(t.id) ? updated++ : added++; byId.set(t.id, t); });
    store.set(tasksKey(sc.id), [...byId.values()]);
  });
  if (data.preparer && !state.preparer) { state.preparer = data.preparer; savePrefs(); }
  load(); render();
  return { added, updated };
}

}

function backupResult(r) {
  const el = modalRoot.querySelector('#backup-msg');
  if (!el) return;
  el.hidden = false;
  if (typeof r === 'string') { el.style.color = 'var(--danger)'; el.textContent = r; return; }
  el.style.color = 'var(--ok)';
  el.textContent = `تم الاستيراد: ${r.added} مهمة جديدة، و${r.updated} مهمة محدَّثة.`;
  toast('تم استيراد المهام');
}

modalRoot.addEventListener('change', e => {
  if (e.target.id !== 'backup-file-in' || !e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => backupResult(importData(String(reader.result)));
  reader.readAsText(e.target.files[0]);
});

function openLockMenu() {
  const set = hasPin();
  modalRoot.innerHTML = `
    <div class="overlay" data-action="close-overlay">
      <form id="pin-form" class="sheet max-w-sm p-5 sm:p-6 flex flex-col gap-3" novalidate>
        <div class="flex items-center gap-3">
          <h2 class="text-lg font-bold flex-1">${set ? 'قفل التطبيق' : 'حماية التطبيق برمز سري'}</h2>
          <button type="button" class="icon-btn" data-action="close" aria-label="إغلاق"><i data-lucide="x"></i></button>
        </div>
        ${set ? `<button type="button" class="btn btn-primary" data-action="lock-now"><i data-lucide="lock"></i>قفل الآن</button>
          <p class="text-sm font-semibold muted mt-2">تغيير الرمز</p>` : `<p class="muted text-sm">سيُطلب الرمز في كل مرة تفتح فيها التطبيق على هذا الجهاز.</p>`}
        <input id="pin-new" class="input pin num" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="رمز جديد" aria-label="رمز جديد من 4 إلى 8 أرقام">
        <input id="pin-confirm" class="input pin num" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="تأكيد الرمز" aria-label="تأكيد الرمز">
        <p id="pin-err" class="err" hidden></p>
        <button type="submit" class="btn ${set ? '' : 'btn-primary'}">${set ? 'حفظ الرمز الجديد' : 'تفعيل القفل'}</button>
        ${set ? `<button type="button" class="move" style="margin-inline:auto;color:var(--danger)" data-action="pin-remove">إلغاء القفل</button>` : ''}
      </form>
    </div>`;
  refreshIcons();
}

modalRoot.addEventListener('submit', async e => {
  if (e.target.id !== 'pin-form') return;
  e.preventDefault();
  const a = modalRoot.querySelector('#pin-new').value.trim(), b = modalRoot.querySelector('#pin-confirm').value.trim();
  const err = !/^\d{4,8}$/.test(a) ? 'اكتب رمزاً من 4 إلى 8 أرقام.' : a !== b ? 'الرمزان غير متطابقين.' : '';
  const el = modalRoot.querySelector('#pin-err');
  if (err) { el.textContent = err; el.hidden = false; return; }
  store.set(PIN_KEY, await hashPin(a));
  closeModal(); render(); toast('تم تفعيل القفل بالرمز السري');
});

load();
if (hasPin()) showLock(); else render();
window.addEventListener('load', refreshIcons);
</script>
