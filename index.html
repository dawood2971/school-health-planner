<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوصلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بوصلة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* Layout: رأس (العنوان، التاريخ، التقدم، الإضافة) ثم لوحة بثلاثة أعمدة: مهام اليوم / قيد التنفيذ / منجزة.
     تصميم فاتح بالكامل بناءً على طلب المستخدم (خلفية فاتحة نظيفة). */
  :root {
    color-scheme: light;
    --bg: #f8fafc;
    --surface: #ffffff;
    --column: #f1f5f9;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #0f766e;
    --accent-2: #059669;
    --accent-soft: #e6f4f1;
    --gold: #d99a1e;
    --gold-soft: #fdf5e3;
    --gold-ink: #8a5a00;
    --accent-ink: #ffffff;
    --ok: #15803d;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 6px rgba(16, 24, 40, .06);
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
  h1, h2, h3 { text-wrap: balance; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  svg.lucide { width: 18px; height: 18px; flex-shrink: 0; }

  /* هوية «بوصلة»: أخضر زيتي أساسي، ذهبي ناعم ثانوي، خلفية رمادية فاتحة */
  /* الهيدر: بطاقة فاتحة بألوان الصفحة مع بوصلة مرسومة بالكود تتحرك إبرتها */
  .hero { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 20px 20px 20px 14px; border-radius: 24px; background: linear-gradient(135deg, #e3f3ef 0%, #f4faf8 55%, #fdf6e6 100%); border: 1px solid #d3ebe5; box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; inset-inline-end: -40px; bottom: -60px; width: 200px; height: 200px; border-radius: 999px; background: radial-gradient(circle, rgba(217, 154, 30, .14), rgba(217, 154, 30, 0) 70%); pointer-events: none; }
  .hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
  .hero-date { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 3px 12px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid #d3ebe5; }
  .hero-date svg.lucide { width: 14px; height: 14px; }
  .hero-greet { margin-top: 6px; font-weight: 600; color: var(--muted); font-size: 14.5px; }
  .hero h1 { font-family: "Cairo", var(--font); font-weight: 900; font-size: clamp(36px, 8vw, 52px); line-height: 1.15; color: #0b5f58; }
  .hero-cta { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px rgba(5, 150, 105, .26); transition: transform .15s, box-shadow .15s; }
  .hero-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(5, 150, 105, .32); }
  .hero-cta svg.lucide { width: 18px; height: 18px; }
  .hero-side { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .clock { direction: ltr; display: inline-flex; align-items: baseline; gap: 3px; padding: 3px 14px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid #d3ebe5; font-family: "Cairo", var(--font); font-weight: 800; font-size: 20px; line-height: 1.4; color: #0b5f58; }
  .clock small { font-size: 13px; font-weight: 700; color: var(--gold); }
  .compass { position: relative; z-index: 1; flex-shrink: 0; width: clamp(118px, 30vw, 168px); height: auto; filter: drop-shadow(0 8px 16px rgba(15, 118, 110, .18)); }
  .compass .needle { transform-origin: 100px 100px; animation: seek 3.2s cubic-bezier(.3, .7, .3, 1) both, sway 6s ease-in-out 3.2s infinite; }
  @keyframes seek { 0% { transform: rotate(-140deg); } 35% { transform: rotate(38deg); } 55% { transform: rotate(-22deg); } 72% { transform: rotate(12deg); } 86% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(7deg); } 65% { transform: rotate(-5deg); } }
  .hero.calm .compass .needle { animation: sway 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .compass .needle, .hero.calm .compass .needle { animation: none; } }

  /* Lenis: التمرير الناعم */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-stopped { overflow: hidden; }

  /* Light Rays (منقول من React Bits): أشعة WebGL خلف محتوى الهيدر */
  .rays { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .7; }

  /* Star Border (منقول من React Bits) حول الزر الأساسي */
  .star-border { position: relative; display: inline-block; margin-top: 8px; padding: 1.5px 0; border-radius: 999px; overflow: hidden; }
  .star-border .sb-top, .star-border .sb-bottom { position: absolute; width: 300%; height: 50%; border-radius: 50%; opacity: .75; z-index: 0; background: radial-gradient(circle, #f5d27a, transparent 10%); animation: 6s linear infinite alternate; }
  .star-border .sb-bottom { bottom: -11px; right: -250%; animation-name: star-bottom; }
  .star-border .sb-top { top: -11px; left: -250%; animation-name: star-top; }
  .star-border .hero-cta { position: relative; z-index: 1; margin-top: 0; }
  @keyframes star-bottom { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-100%, 0); opacity: 0; } }
  @keyframes star-top { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(100%, 0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .star-border .sb-top, .star-border .sb-bottom { animation: none; opacity: 0; } }
  .blur-word { display: inline-block; will-change: transform, filter, opacity; }

  .actions { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 58px; padding: 10px 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; font-size: 13.5px; text-align: center; line-height: 1.3; transition: border-color .15s, transform .15s; }
  .tile:hover { border-color: #b9dcd5; transform: translateY(-1px); }
  .tile svg.lucide { width: 20px; height: 20px; color: var(--accent); }
  @media (min-width: 720px) { .tile { flex-direction: row; } }

  .quote { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--gold); box-shadow: var(--shadow); }
  .quote-ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); flex-shrink: 0; }
  .quote-ic svg.lucide { width: 20px; height: 20px; }
  .quote small { display: block; font-size: 12px; font-weight: 700; color: var(--gold-ink); letter-spacing: .02em; }
  .quote p { font-weight: 600; font-size: 15.5px; line-height: 1.6; }

  .tabs { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); color: var(--muted); text-align: center; line-height: 1.3; transition: border-color .15s, background .15s, color .15s; }
  .tab:hover { border-color: #b9dcd5; color: var(--ink); }
  .tab svg.lucide { width: 22px; height: 22px; }
  .tab span { display: flex; flex-direction: column; }
  .tab b { font-size: 14px; color: inherit; }
  .tab small { font-size: 11.5px; font-weight: 600; opacity: .8; }
  .tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .08); }
  .tab.on b { color: #0b5f58; }
  @media (min-width: 720px) { .tab { flex-direction: row; justify-content: center; gap: 10px; text-align: start; } }

  .progress-card { padding: 18px; }
  .progress-card .pct { font-family: "Cairo", var(--font); font-size: 30px; font-weight: 900; line-height: 1; color: var(--gold-ink); }
  .bar.gold > span { background: linear-gradient(90deg, #f0b84a, var(--gold)); }
  .bar.full > span { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .badge-done { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; font-size: 14px; }
  .badge-done svg.lucide { width: 22px; height: 22px; color: var(--gold); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border-radius: 12px; padding: 8px 16px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background .15s, border-color .15s, box-shadow .15s; }
  .btn:hover { border-color: #c7ced6; box-shadow: var(--shadow); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: #096b60; border-color: #096b60; }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--muted); }
  .icon-btn:hover { background: var(--column); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); background: #fdecec; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--column); }
  .seg button, .seg label { flex: 1; text-align: center; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button { padding: 8px 12px; }
  .seg label span { display: block; padding: 8px 12px; border-radius: 9px; }
  .seg .on, .seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .bar { height: 12px; border-radius: 999px; background: var(--column); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

  .quick { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; transition: border-color .15s, box-shadow .15s; }
  .quick:hover { border-color: #c7ced6; box-shadow: var(--shadow); }
  .dot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; }
  .dot svg.lucide { width: 16px; height: 16px; }

  .column { background: var(--column); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 4px; }
  .count { font-size: 13px; font-weight: 700; min-width: 26px; text-align: center; padding: 1px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); }
  .empty { border: 1.5px dashed #cfd6de; border-radius: 14px; padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }

  .tcard { background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); border: 1px solid transparent; transition: border-color .15s, opacity .2s; }
  .tcard:hover { border-color: var(--line); }
  .tcard.is-done { background: #fafbfc; box-shadow: none; border-color: var(--line); }
  .tcard.is-done .t-title { text-decoration: line-through; text-decoration-color: #9aa5b1; color: var(--muted); }
  .tcard.is-done .t-body { opacity: .6; }
  .t-title { font-weight: 600; font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .t-desc { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .check { display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; border-radius: 8px; border: 2px solid #b8c1cb; background: var(--surface); color: transparent; flex-shrink: 0; transition: background .15s, border-color .15s; }
  .check:hover { border-color: var(--accent); color: #9fd3cb; }
  .check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check svg.lucide { width: 15px; height: 15px; stroke-width: 3; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .meta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .meta svg.lucide { width: 14px; height: 14px; }
  .meta.late { color: var(--danger); }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--column); color: var(--ink); }
  .move { font-size: 12.5px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; }
  .move:hover { background: var(--accent-soft); }
  .move svg.lucide { width: 14px; height: 14px; }
  .day { background: var(--column); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .day-head { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
  .day-add { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--accent); background: var(--surface); box-shadow: var(--shadow); margin-inline-start: auto; }
  .day-add:hover { background: var(--accent); color: #fff; }
  .day-empty { font-size: 13px; color: var(--muted); padding: 6px 2px 4px; }
  .week-grid { display: grid; gap: 10px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 640px) { .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 900px) { .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1180px) { .week-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .witem { display: flex; align-items: flex-start; gap: 8px; background: var(--surface); border-radius: 10px; padding: 8px 9px; box-shadow: var(--shadow); }
  .witem .check { width: 20px; height: 20px; border-radius: 6px; }
  .witem .check svg.lucide { width: 13px; height: 13px; }
  .w-title { flex: 1; min-width: 0; text-align: start; font-size: 13.5px; font-weight: 600; line-height: 1.45; overflow-wrap: break-word; }
  .w-title:hover { color: var(--accent); }
  .witem.is-done .w-title { text-decoration: line-through; color: var(--muted); }
  .pdot { width: 8px; height: 8px; border-radius: 999px; margin-top: 7px; flex-shrink: 0; }
  .w-del { color: var(--muted); margin-top: 1px; }
  .w-del:hover { color: var(--danger); }
  .w-del svg.lucide { width: 15px; height: 15px; }
  .dchip { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; padding: 6px 8px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.35; }
  .dchip b { font-size: 13px; white-space: nowrap; }
  .dchip small { white-space: nowrap; }
  .dchip small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .dchip:hover { border-color: #c7ced6; }
  .dchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dchip.on small { color: #d8f3ee; }
  .confirm-del { font-size: 12.5px; font-weight: 700; color: var(--danger); background: #fdecec; border-radius: 9px; padding: 5px 10px; }

  .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 10px 12px; min-height: 44px; }
  .input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .gchip { cursor: pointer; position: relative; }
  .gchip input, .pchip input { position: absolute; opacity: 0; pointer-events: none; }
  .gchip span { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
  .gchip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pchip { flex: 1; position: relative; cursor: pointer; }
  .pchip span { display: block; text-align: center; padding: 9px 8px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--muted); }
  .pchip input:checked + span { background: var(--pbg); color: var(--pfg); border-color: var(--pfg); }
  .gchip input:focus-visible + span, .pchip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sugg { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px dashed #c7ced6; color: var(--muted); }
  .sugg:hover { border-color: var(--accent); color: var(--ink); }
  .err { color: var(--danger); font-size: 13.5px; font-weight: 600; }

  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(16, 24, 40, .45); display: flex; align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .sheet { width: 100%; max-height: calc(100% - 8px); overflow: auto; background: var(--surface); border-radius: 20px; box-shadow: 0 20px 50px rgba(16, 24, 40, .2); }
  .lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  .lock-card { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  .pin { text-align: center; font-size: 26px; letter-spacing: .4em; font-weight: 700; }
  .toast { position: fixed; z-index: 60; bottom: max(18px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }

  /* بطاقة الإنفوجرافيك: ألوان ثابتة لأنها تُصدَّر صورةً وتُطبع */
  #infographic { width: 760px; background: #ffffff; color: #1c2733; font-family: var(--font); border-radius: 22px; overflow: hidden; border: 1px solid #e2e6eb; }
  #infographic .ig-head { background: linear-gradient(135deg, #0b6b61 0%, #0f8a7c 60%, #1aa190 100%); color: #ffffff; padding: 28px 32px; display: flex; gap: 24px; align-items: center; justify-content: space-between; }
  #infographic .ig-title { font-weight: 700; font-size: 27px; line-height: 1.35; }
  #infographic .ig-sub { font-size: 15px; color: #d8f3ee; }
  #infographic .ig-body { padding: 24px 32px 8px; display: flex; flex-direction: column; gap: 20px; }
  #infographic .ig-stats { display: flex; gap: 12px; }
  #infographic .ig-stat { flex: 1; border-radius: 14px; padding: 12px 16px; background: #f4f6f8; }
  #infographic .ig-stat b { display: block; font-size: 26px; line-height: 1.3; }
  #infographic .ig-stat small { font-size: 13px; color: #66727f; font-weight: 600; }
  #infographic .ig-sec-head { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid #eef1f4; margin-bottom: 10px; }

function migrateV1() {
  if (store.get('shp:v2:migrated', false)) return;
  try {
    const bySchool = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const m = key && key.match(/^shp:v1:([^:]+):(\d{4}-\d{2}-\d{2})$/);
      if (!m) continue;
      const [, school, date] = m;
      (JSON.parse(localStorage.getItem(key)) || []).forEach(t => {
        const done = t.status === 'done';
        (bySchool[school] = bySchool[school] || []).push({
          id: t.id || uid(), type: t.type || 'custom', title: t.title || '',
          desc: [t.time ? `الوقت: ${fmtTime(t.time)}` : '', t.note].filter(Boolean).join(' · '),
          grades: t.grades || [], priority: 'normal', due: date,
          status: done ? 'done' : 'today', prevStatus: 'today', doneAt: done ? date : null,
          created: t.created || Date.now(),
        });
      });
    }
    Object.entries(bySchool).forEach(([school, list]) => store.set(tasksKey(school), [...store.get(tasksKey(school), []), ...list]));
    const old = JSON.parse(localStorage.getItem('shp:v1:prefs') || '{}');
    if (old.school || old.preparer) store.set(PREFS_KEY, { ...store.get(PREFS_KEY, {}), ...old });
  } catch {}
  store.set('shp:v2:migrated', true);
}

function todayScope() {
  const t = today();
  return state.tasks.filter(x => x.status === 'done' ? x.doneAt === t : (x.due || t) <= t);
}
function stats() {
  const scope = todayScope();
  const done = scope.filter(x => x.status === 'done').length;
  return { total: scope.length, done, left: scope.length - done, pct: scope.length ? Math.round((done / scope.length) * 100) : 0 };
}
function columnTasks(key, list = state.tasks) {
  const items = list.filter(t => t.status === key && !isUpcoming(t));
  if (key === 'done') return items.sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '') || b.created - a.created);
  return items.sort((a, b) => prioOf(a).rank - prioOf(b).rank || (a.due || '').localeCompare(b.due || '') || a.created - b.created);
}

            <p class="muted text-sm font-semibold num">${esc(school.name)} · ${s.total ? `أنجزت <span data-count="${s.done}" data-key="done">${s.done}</span> من <span data-count="${s.total}" data-key="total">${s.total}</span>` : 'لا توجد مهام مستحقة اليوم'}</p>
          </div>
          <span class="pct num" ${s.total && s.pct === 100 ? 'style="color:var(--accent)"' : ''}><span data-count="${s.pct}" data-key="pct">${s.pct}</span>%</span>
        </div>
        <div id="day-bar" class="bar ${s.total && s.pct === 100 ? 'full' : 'gold'}" role="progressbar" aria-valuenow="${s.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${s.pct}%"></span></div>
        ${s.total && s.pct === 100 ? `<div class="badge-done"><i data-lucide="party-popper"></i>أحسنت بو فاطمة! أنجزت كل مهام اليوم.</div>` : ''}
      </section>

      <div class="flex flex-wrap items-center gap-2">
        <span class="text-sm font-semibold muted">إضافة سريعة:</span>
        ${QUICK_ORDER.map(k => { const T = TYPES[k]; return `
          <button class="quick" data-action="add" data-type="${k}">
            <span class="dot" style="background:${rgba(T.color, .12)};color:${T.color}"><i data-lucide="${T.icon}"></i></span>${T.label}
          </button>`; }).join('')}
      </div>
    </header>

    <main class="grid gap-5 lg:grid-cols-3 items-start mt-7">
      ${Object.keys(COLUMNS).map(column).join('')}
    </main>
    ${upcomingSection()}
    ${state.tasks.length === 0 ? `
      <div class="text-center mt-6">
        <button class="btn" data-action="sample"><i data-lucide="file-text"></i>تحميل مهام تجريبية لرؤية الشكل</button>
      </div>` : ''}`;
  refreshIcons();
  afterRender();
}

function column(key) {
  const C = COLUMNS[key];
  const list = columnTasks(key);
  return `
    <section class="column" aria-labelledby="col-${key}">
      <div class="col-head">
        <span style="color:${C.color}"><i data-lucide="${C.icon}"></i></span>
        <h2 id="col-${key}" class="font-bold text-[17px]">${C.label}</h2>
        <span class="count num" data-count="${list.length}" data-key="col-${key}">${list.length}</span>
        ${key === 'done' && list.length ? `<button class="move ms-auto" style="color:var(--danger)" data-action="clear-done"><i data-lucide="eraser"></i>حذف المهام المنجزة</button>` : ''}
      </div>
      ${list.length
        ? `<ul class="flex flex-col gap-3">${list.map(taskCard).join('')}</ul>`
        : `<p class="empty">${key === 'today' ? 'لا توجد مهام بعد. اضغط «إضافة مهمة» للبدء.' : key === 'progress' ? 'لا توجد مهام قيد التنفيذ.' : 'المهام التي تُتمّها تظهر هنا.'}</p>`}
    </section>`;
}

let weekOffset = 0;

// خطة الأسبوع: الأسبوع كاملاً من الأحد إلى الخميس، بكل مهام كل يوم
function upcomingSection() {
  const days = weekDays(weekOffset);
  const start = days[0], end = days[4];
  const byDay = d => state.tasks.filter(t => t.due === d)
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || prioOf(a).rank - prioOf(b).rank || a.created - b.created);
  const shown = days;
  const later = state.tasks.filter(t => isUpcoming(t) && t.due > end).length;
  return `
    <section class="mt-8" aria-labelledby="up-h">
      <div class="col-head mb-3">
        <span style="color:#6d28d9"><i data-lucide="calendar-range"></i></span>
        <h2 id="up-h" class="font-bold text-[17px]">خطة الأسبوع</h2>
        <span class="text-sm muted font-semibold num">${esc(fmtDayMonth(start))} – ${esc(fmtDayMonth(end))}</span>
        <div class="flex items-center gap-1 ms-auto">
          <button class="move" data-action="week-export"><i data-lucide="image-down"></i>تصدير جدول الأسبوع</button>
          ${weekOffset !== 0 ? `<button class="move" data-action="week-now">هذا الأسبوع</button>` : ''}
          <button class="icon-btn" data-action="week" data-n="-1" aria-label="الأسبوع السابق"><i data-lucide="chevron-right"></i></button>
          <button class="icon-btn" data-action="week" data-n="1" aria-label="الأسبوع التالي"><i data-lucide="chevron-left"></i></button>
        </div>
      </div>
      <div class="week-grid">
        ${shown.map(d => { const items = byDay(d); return `
          <div class="day" ${d === today() ? 'style="box-shadow: inset 0 0 0 2px var(--accent)"' : ''}>
            <div class="day-head">
              <div class="min-w-0">
                <h3 class="font-bold text-[15px] leading-tight">${esc(fmtWeekday(d))}</h3>
                <span class="text-xs muted font-semibold num">${esc(fmtDayMonth(d))}${d === today() ? ' · اليوم' : d === addDays(today(), 1) ? ' · غداً' : ''}</span>
              </div>
              <button class="day-add" data-action="add-on" data-d="${d}" aria-label="إضافة مهمة ليوم ${esc(fmtWeekday(d))}"><i data-lucide="plus"></i></button>
            </div>
            ${items.length ? `<ul class="flex flex-col gap-2">${items.map(weekItem).join('')}</ul>` : `<p class="day-empty">لا توجد مهام</p>`}
          </div>`; }).join('')}
      </div>
      ${later ? `<p class="text-sm muted font-semibold mt-3 num">و${later} ${later === 1 ? 'مهمة' : 'مهام'} بعد ${esc(fmtDayMonth(end))}. استخدم السهم للانتقال إلى الأسابيع التالية.</p>` : ''}
    </section>`;
}

function weekItem(t) {
  const P = prioOf(t), done = t.status === 'done';
  return `
    <li class="witem ${done ? 'is-done' : ''}" data-id="${t.id}">
      <button class="check ${done ? 'on' : ''}" data-action="toggle" role="checkbox" aria-checked="${done}" aria-label="${done ? 'إلغاء الإتمام' : 'إتمام المهمة'}"><i data-lucide="check"></i></button>
      <button class="w-title" data-action="edit" title="تعديل">${esc(titleOf(t))}</button>
      <span class="pdot" style="background:${P.fg}" title="${P.label}"></span>
    </li>`;
}

function taskCard(t) {
  const T = typeOf(t), P = prioOf(t);
  const done = t.status === 'done';
  const late = !done && t.due && t.due < today();
  const grades = (t.grades || []).slice().sort((a, b) => a - b);
  return `
    <li class="tcard ${done ? 'is-done' : ''}" data-id="${t.id}">
      <div class="flex gap-3 items-start">
        <button class="check ${done ? 'on' : ''}" data-action="toggle" role="checkbox" aria-checked="${done}" aria-label="${done ? 'إلغاء الإتمام' : 'إتمام المهمة'}"><i data-lucide="check"></i></button>
        <div class="min-w-0 flex-1">
          <div class="flex items-start gap-2">
            <p class="t-title flex-1 min-w-0">${esc(titleOf(t))}</p>
            <div class="flex items-center -mt-1 -ms-1">
              <button class="icon-btn" data-action="edit" aria-label="تعديل المهمة"><i data-lucide="pencil"></i></button>
              ${state.pendingDelete === t.id
                ? `<button class="confirm-del" data-action="delete-confirm">تأكيد الحذف</button>`
                : `<button class="icon-btn danger" data-action="delete" aria-label="حذف المهمة"><i data-lucide="trash-2"></i></button>`}
            </div>
          </div>
          <div class="t-body">
            ${t.desc ? `<p class="t-desc mt-0.5">${esc(t.desc)}</p>` : ''}
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-2.5">
              <span class="pill" style="background:${P.bg};color:${P.fg}">${P.label}</span>
              ${t.due ? `<span class="meta num ${late ? 'late' : ''}"><i data-lucide="calendar-clock"></i>${late ? 'متأخرة · ' : ''}${esc(fmtDue(t.due))}</span>` : ''}
              ${t.type !== 'custom' ? `<span class="meta" style="color:${T.color}"><i data-lucide="${T.icon}"></i>${T.label}</span>` : ''}
            </div>
            ${grades.length ? `<div class="flex flex-wrap gap-1 mt-2">${grades.map(g => `<span class="chip">${gradeName(g)}</span>`).join('')}</div>` : ''}
          </div>
          ${t.status === 'today' && !isUpcoming(t) ? `<div class="mt-2"><button class="move" data-action="move" data-to="progress"><i data-lucide="arrow-left"></i>نقل إلى قيد التنفيذ</button></div>` : ''}
          ${t.status === 'progress' ? `<div class="mt-2"><button class="move" data-action="move" data-to="today"><i data-lucide="undo-2"></i>إعادة إلى مهام اليوم</button></div>` : ''}
        </div>
      </div>
    </li>`;
}

// ---------- نافذة الإضافة والتعديل ----------
const modalRoot = document.getElementById('modal-root');
let draft = null, formError = '', confirmAction = null;

function openForm(task) {
  draft = JSON.parse(JSON.stringify(task));
  formWeek = weekOf(draft.due || today());
  formError = '';
  renderForm();
  setTimeout(() => modalRoot.querySelector('#f-title')?.focus(), 30);
}

function renderForm() {
  const T = TYPES[draft.type];
  const isEdit = state.tasks.some(t => t.id === draft.id);
  const mode = schoolGrades().length ? T.grades : 'none';
  const statuses = isEdit ? ['today', 'progress', 'done'] : ['today', 'progress'];
  modalRoot.innerHTML = `
    <div class="overlay" data-action="close-overlay" data-lenis-prevent>
      <form id="task-form" class="sheet max-w-lg p-5 sm:p-6 flex flex-col gap-4" novalidate>
        <div class="flex items-center gap-3">
          <h2 class="text-xl font-bold flex-1">${isEdit ? 'تعديل المهمة' : 'إضافة مهمة'}</h2>
          <button type="button" class="icon-btn" data-action="close" aria-label="إغلاق"><i data-lucide="x"></i></button>
        </div>

        <div>
          <label class="lbl" for="f-title">${T.titleLabel}</label>
          <input id="f-title" class="input" value="${esc(draft.title)}" placeholder="${esc(T.ph)}" autocomplete="off">
          ${T.suggestions ? `<div class="flex flex-wrap gap-2 mt-2">${T.suggestions.map(s => `<button type="button" class="sugg" data-action="sugg" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        </div>

        <div>
          <label class="lbl" for="f-desc">وصف قصير (اختياري)</label>
          <textarea id="f-desc" class="input" rows="2" placeholder="تفاصيل تساعدك على تنفيذ المهمة">${esc(draft.desc)}</textarea>
        </div>

        <fieldset>
          <legend class="lbl">الأولوية</legend>
          <div class="flex gap-2">
            ${Object.entries(PRIORITIES).map(([k, P]) => `
              <label class="pchip" style="--pbg:${P.bg};--pfg:${P.fg}">
                <input type="radio" name="priority" value="${k}" ${draft.priority === k ? 'checked' : ''}>
                <span>${P.label}</span>
              </label>`).join('')}
          </div>
        </fieldset>

        <fieldset>
          <legend class="lbl">يوم المهمة</legend>
          <div id="f-days">${dayStrip()}</div>
        </fieldset>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="lbl" for="f-due">تاريخ الاستحقاق (أو اختر أي تاريخ)</label>
            <input id="f-due" type="date" class="input num" value="${esc(draft.due)}">
            <p id="f-due-hint" class="text-xs font-semibold mt-1.5" style="color:#6d28d9" ${draft.due > today() && draft.status === 'today' ? '' : 'hidden'}>ستظهر في «خطة الأسبوع» تحت يومها، ثم تنتقل إلى «مهام اليوم» في موعدها.</p>
          </div>
          <div>
            <label class="lbl" for="f-type">التصنيف</label>
            <select id="f-type" class="input">
              ${TYPE_ORDER.map(k => `<option value="${k}" ${k === draft.type ? 'selected' : ''}>${TYPES[k].label}</option>`).join('')}
            </select>
          </div>
        </div>

        ${mode !== 'none' ? `
          <fieldset>
            <legend class="lbl">${mode === 'single' ? 'الصف المستهدف' : mode === 'multi' ? 'الصفوف المستهدفة (يمكن اختيار أكثر من صف)' : 'الصفوف المستهدفة (اختياري)'}</legend>
            <div class="flex flex-wrap gap-2">
              ${schoolGrades().map(g => `
                <label class="gchip">
                  <input type="${mode === 'single' ? 'radio' : 'checkbox'}" name="grade" value="${g}" ${draft.grades.includes(+g) ? 'checked' : ''}>
                  <span>${gradeName(g)}</span>
                </label>`).join('')}
            </div>
          </fieldset>` : ''}

        <fieldset>
          <legend class="lbl">الحالة</legend>
          <div class="seg">
            ${statuses.map(k => `<label><input class="sr-only" type="radio" name="status" value="${k}" ${draft.status === k ? 'checked' : ''}><span>${COLUMNS[k].label}</span></label>`).join('')}
          </div>
        </fieldset>

        ${formError ? `<p class="err" role="alert">${formError}</p>` : ''}

        <div class="flex gap-2 justify-end flex-wrap pt-1">
          ${isEdit ? `<button type="button" class="btn me-auto" style="color:var(--danger)" data-action="form-delete"><i data-lucide="trash-2"></i>حذف</button>` : ''}
          <button type="button" class="btn" data-action="close">إلغاء</button>
          <button type="submit" class="btn btn-primary"><i data-lucide="${isEdit ? 'check' : 'plus'}"></i>${isEdit ? 'حفظ التعديلات' : 'إضافة المهمة'}</button>

      </form>

let formWeek = 0;
function dayStrip() {
  const due = modalRoot.querySelector('#f-due')?.value || draft.due;
  const days = weekDays(formWeek);
  const label = d => d === today() ? 'اليوم' : d === addDays(today(), 1) ? 'غداً' : fmtWeekday(d);
  return `
    <div class="flex items-center gap-1">
      <button type="button" class="icon-btn" data-action="fweek" data-n="-1" aria-label="الأسبوع السابق"><i data-lucide="chevron-right"></i></button>
      <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5 flex-1">
        ${days.map(d => `<button type="button" class="dchip ${d === due ? 'on' : ''}" data-action="day-pick" data-d="${d}"><b>${label(d)}</b><small class="num">${esc(fmtDayMonth(d))}</small></button>`).join('')}
      </div>
      <button type="button" class="icon-btn" data-action="fweek" data-n="1" aria-label="الأسبوع التالي"><i data-lucide="chevron-left"></i></button>
    </div>`;
}
function refreshDayStrip() {
  const box = modalRoot.querySelector('#f-days');
  if (box) { box.innerHTML = dayStrip(); refreshIcons(); }
  updateDueHint();
}

function readForm() {
  const f = modalRoot.querySelector('#task-form');
  if (!f) return;
  draft.title = f.querySelector('#f-title').value;
  draft.desc = f.querySelector('#f-desc').value;
  draft.due = f.querySelector('#f-due').value;
  draft.priority = (f.querySelector('input[name=priority]:checked') || {}).value || 'normal';
  draft.status = (f.querySelector('input[name=status]:checked') || {}).value || 'today';
  draft.grades = [...f.querySelectorAll('input[name=grade]:checked')].map(i => +i.value);
}

function validate() {
  const T = TYPES[draft.type];
  if (!T.defaultTitle && !draft.title.trim()) return `اكتب ${T.titleLabel.replace(' (اختياري)', '')}.`;
  const noGrades = !schoolGrades().length;
  if (!noGrades && T.grades === 'single' && draft.grades.length !== 1) return 'اختر الصف المستهدف للمحاضرة.';
  if (!noGrades && T.grades === 'multi' && draft.grades.length === 0) return 'اختر صفاً واحداً على الأقل للفحص الشامل.';
  if (!draft.due) return 'اختر تاريخ الاستحقاق.';
  return '';
}

function closeModal() { modalRoot.innerHTML = ''; draft = null; confirmAction = null; clearTimeout(renderTimer); rendered = null; }

// إنفوجرافيك الأسبوع بأسلوب الملصق للمدرستين والبرنامج معاً
function weekPosterHTML() {
  const days = weekDays(weekOffset);
  const data = SCHOOLS.map(sc => ({ ...sc, tasks: (sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), [])).filter(t => days.includes(t.due)) }));
  const all = data.flatMap(sc => sc.tasks.map(t => ({ ...t, tag: sc.tag })));
  const done = all.filter(t => t.status === 'done').length;
  const pct = all.length ? Math.round((done / all.length) * 100) : 0;
  const byDay = d => all.filter(t => t.due === d).sort((a, b) => (a.status === 'done') - (b.status === 'done') || prioOf(a).rank - prioOf(b).rank);
  const shown = days;
  const busiest = shown.reduce((m, d) => byDay(d).length > byDay(m).length ? d : m, shown[0]);
  const prio = Object.entries(PRIORITIES).map(([k, P]) => ({ ...P, n: all.filter(t => (t.priority || 'normal') === k).length }));
  const types = TYPE_ORDER.map(k => ({ k, T: TYPES[k], n: all.filter(t => (t.type || 'custom') === k).length })).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 6);
  const top = all.filter(t => t.status !== 'done').sort((a, b) => prioOf(a).rank - prioOf(b).rank || a.due.localeCompare(b.due))[0];
  const gradesAll = [...new Set(all.flatMap(t => t.grades || []))].sort((a, b) => a - b);
  const y = fromIso(days[4]).getFullYear();
  return `
    <div id="infographic" class="poster" dir="rtl" lang="ar">
      <div class="p-kicker">الصحة المدرسية · ${esc(fmtDayMonth(days[0]))} – ${esc(fmtDayMonth(days[4]))} ${y}</div>
      <div class="p-title">خطة <span>الأسبوع</span></div>
      <div class="p-sub">مدرستا أبو الدرداء والإمام سيف بن سلطان، وبرنامج الصحة المدرسية والجامعية</div>
      <div class="p-rule" style="margin:18px 0 22px"></div>

      <div class="p-row">
        <div style="flex:1.1">
          <div class="p-h dark">مهام الأسبوع</div>
          <div class="p-big num">${all.length}</div>
          <div class="p-cap">مهمة موزعة على ${shown.length} ${shown.length > 2 ? 'أيام' : 'يوم'} عمل</div>
          <div class="p-thin" style="margin:14px 0"></div>
          <div class="p-note">أكثر الأيام ازدحاماً: <b style="color:#48484a">${esc(fmtWeekday(busiest))}</b> بعدد <span class="num">${byDay(busiest).length}</span> مهام</div>
        </div>
        <div style="width:2px;background:#cfc5b8"></div>
        <div style="flex:1">
          <div class="p-big num" style="color:#e2725b">${pct}<small>%</small></div>
          <div class="p-cap dark">من مهام الأسبوع<br>منجزة حتى الآن</div>
          <div class="p-bar" style="height:12px;margin-top:14px"><i style="width:${pct}%"></i></div>
          <div class="p-note" style="margin-top:8px"><span class="num">${done}</span> منجزة · <span class="num">${all.length - done}</span> متبقية</div>
        </div>
      </div>

      <div class="p-rule" style="margin:24px 0 18px"></div>
      <div class="p-h">التوزيع حسب الجهة</div>
      <div class="p-row" style="margin-top:12px;gap:20px">
        ${data.map(sc => { const d = sc.tasks.filter(t => t.status === 'done').length; return `
          <div class="p-ent">
            <b class="num">${sc.tasks.length}</b>
            <span>${esc(sc.name)}</span>
            <div class="p-bar"><i style="width:${sc.tasks.length ? Math.round((d / sc.tasks.length) * 100) : 0}%"></i></div>
          </div>`; }).join('')}
      </div>

      <div class="p-rule" style="margin:24px 0 18px"></div>
      <div class="p-row" style="gap:24px">
        <div style="flex:1.6">
          <div class="p-h">أنواع المهام</div>
          <div style="display:flex;flex-wrap:wrap;gap:14px 6px;margin-top:14px">
            ${types.length ? types.map(x => `
              <div class="p-type">
                <span class="ring"><i data-lucide="${x.T.icon}"></i></span>
                <b class="num">${x.n}</b>
                <small>${x.T.label}</small>
              </div>`).join('') : '<div class="p-note">لا توجد مهام هذا الأسبوع.</div>'}
          </div>
        </div>
        <div style="flex:1">
          <div class="p-h dark">الأولوية</div>
          ${prio.map(P => `
            <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
              <span class="p-dot" style="background:${P.fg};width:14px;height:14px"></span>
              <span style="font-weight:700;font-size:15px;width:64px">${P.label}</span>
              <div class="p-bar" style="flex:1;margin:0"><i style="width:${all.length ? Math.round((P.n / all.length) * 100) : 0}%;background:${P.fg}"></i></div>
              <b class="num" style="font-size:20px;font-weight:900;width:28px;text-align:center">${P.n}</b>
            </div>`).join('')}
          ${gradesAll.length ? `<div class="p-note" style="margin-top:16px">الصفوف المستهدفة: ${gradesAll.map(g => GRADES[g]).join('، ')}</div>` : ''}
        </div>
      </div>

      ${top ? `
        <div class="p-coral" style="margin-top:26px">
          <div class="p-cap" style="font-size:16px">أهم مهمة هذا الأسبوع</div>
          <div style="font-size:32px;font-weight:900;line-height:1.35;margin-top:2px">«${esc(titleOf(top))}»</div>
          <div class="p-note" style="margin-top:4px">${esc([top.tag, typeOf(top).label, prioOf(top).label, fmtWeekday(top.due) + ' ' + fmtDayMonth(top.due)].join(' · '))}</div>
        </div>` : ''}

      <div class="p-rule" style="margin:26px 0 6px"></div>
      <div class="p-h" style="margin-bottom:4px">أيام الأسبوع</div>
      ${shown.map(d => { const list = byDay(d); return `
        <div class="p-day">

              </span>`).join('') : '<span class="p-note">لا توجد مهام</span>'}

      <div class="p-rule" style="margin:16px 0 12px"></div>

        <span>الخطة الأسبوعية للصحة المدرسية</span>
      </div>

}

// جدول أسبوعي يجمع المدرستين: صف لكل يوم وعمود لكل مدرسة
function weekReportHTML() {
  const days = weekDays(weekOffset);
  const data = SCHOOLS.map(sc => ({ ...sc, tasks: sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []) }));
  const forDay = (sc, d) => sc.tasks.filter(t => t.due === d)
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || prioOf(a).rank - prioOf(b).rank || a.created - b.created);
  const shown = days;
  const all = data.flatMap(sc => sc.tasks.filter(t => days.includes(t.due)));
  const done = all.filter(t => t.status === 'done').length;
  const cell = (sc, d) => {
    const list = forDay(sc, d);
    if (!list.length) return `<div class="wk-none">—</div>`;
    return list.map(t => {
      const T = typeOf(t), P = prioOf(t), isDone = t.status === 'done';
      const grades = (t.grades || []).slice().sort((a, b) => a - b).map(gradeName).join('، ');
      return `
        <div class="wk-item ${isDone ? 'done' : ''}">
          ${isDone ? `<span class="done-ok"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>` : `<span class="wk-dot" style="background:${P.fg}"></span>`}
          <div style="min-width:0">
            <div class="wk-title">${esc(titleOf(t))}</div>
            <div class="wk-meta">${esc([T.label, grades].filter(Boolean).join(' · '))}</div>
          </div>
        </div>`;
    }).join('');
  };
  return `
    <div id="infographic" class="ig-week" dir="rtl" lang="ar">
      <div class="ig-head">
        <div style="min-width:0">
          <div class="ig-sub" style="font-weight:600">الخطة الأسبوعية · الصحة المدرسية</div>
          <div class="ig-title">جدول الأسبوع للمدرستين والبرنامج</div>
          <div class="ig-sub num" style="margin-top:4px">${esc(fmtDayMonth(days[0]))} – ${esc(fmtDayMonth(days[4]))} ${fromIso(days[4]).getFullYear()}</div>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:34px;font-weight:700;line-height:1.1" class="num">${all.length}</div>
          <div class="ig-sub" style="font-weight:600">مهمة · <span class="num">${done}</span> منجزة</div>
        </div>
      </div>
      <div class="ig-body">
        <div class="wk-grid" style="grid-template-columns: 120px repeat(${data.length}, minmax(0, 1fr))">
          <div class="wk-th">اليوم</div>
          ${data.map(sc => `<div class="wk-th">${esc(sc.name)}</div>`).join('')}
          ${shown.map(d => `
            <div class="wk-day${d === today() ? ' wk-today' : ''}"><b>${esc(fmtWeekday(d))}</b><small class="num">${esc(fmtDayMonth(d))}</small></div>
            ${data.map(sc => `<div class="wk-cell${d === today() ? ' wk-today' : ''}">${cell(sc, d)}</div>`).join('')}`).join('')}
        </div>
        <div class="wk-legend">
          ${Object.values(PRIORITIES).map(P => `<span><span class="wk-dot" style="background:${P.fg}"></span>${P.label}</span>`).join('')}
          <span><span class="wk-dot" style="background:#15803d"></span>منجزة</span>
        </div>
      </div>
      <div class="ig-foot">
        <span>المعدّ: <span id="ig-preparer-out">${esc(state.preparer.trim() || '—')}</span></span>
        <span class="num">${all.length ? Math.round((done / all.length) * 100) : 0}% من مهام الأسبوع منجزة</span>
      </div>
    </div>`;
}

function openConfirm(title, text, okLabel, onOk) {
  confirmAction = onOk;
  modalRoot.innerHTML = `
    <div class="overlay" data-action="close-overlay" data-lenis-prevent>
      <div class="sheet max-w-sm p-5 sm:p-6 flex flex-col gap-3" role="alertdialog" aria-labelledby="cf-title">

}

function setStatus(t, status) {
  if (status === 'done' && t.status !== 'done') { t.prevStatus = t.status; t.doneAt = today(); }
  if (status !== 'done') t.doneAt = null;
  t.status = status;
}

function updateDueHint() {
  const due = modalRoot.querySelector('#f-due')?.value;
  const status = (modalRoot.querySelector('input[name=status]:checked') || {}).value;
  const hint = modalRoot.querySelector('#f-due-hint');
  if (hint) hint.hidden = !(due && due > today() && status === 'today');
}

modalRoot.addEventListener('change', e => {
  if (draft && e.target.id === 'f-due' && e.target.value) { formWeek = weekOf(e.target.value); refreshDayStrip(); }
  if (draft && e.target.name === 'status') updateDueHint();
  if (!draft || e.target.id !== 'f-type') return;
  readForm();
  draft.type = e.target.value;
  const mode = TYPES[draft.type].grades;
  if (mode === 'none') draft.grades = [];
  if (mode === 'single') draft.grades = draft.grades.slice(0, 1);
  formError = '';
  renderForm();
});

modalRoot.addEventListener('submit', e => {
  if (e.target.id !== 'task-form') return;
  e.preventDefault();
  readForm();
  formError = validate();
  if (formError) { renderForm(); return; }
  const existing = state.tasks.find(x => x.id === draft.id);
  const t = { ...draft, title: draft.title.trim(), desc: draft.desc.trim() };
  if (existing) {
    const status = t.status;
    t.status = existing.status; t.doneAt = existing.doneAt; t.prevStatus = existing.prevStatus;
    setStatus(t, status);
    state.tasks[state.tasks.indexOf(existing)] = t;
    toast('تم حفظ التعديلات');
  } else {
    state.tasks.push(t);
    toast(isUpcoming(t) ? `أُضيفت إلى خطة الأسبوع (${fmtDue(t.due)})` : 'تمت إضافة المهمة');
  }
  save(); closeModal(); render();
});

modalRoot.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const act = a.dataset.action;
  if (act === 'close-overlay' && e.target !== a) return;
  if (act === 'close' || act === 'close-overlay') closeModal();
  if (act === 'confirm-ok') { const fn = confirmAction; closeModal(); fn && fn(); }
  if (act === 'form-delete' && draft) {
    const id = draft.id;
    openConfirm('حذف المهمة؟', 'سيتم حذف هذه المهمة نهائياً.', 'حذف', () => {
      state.tasks = state.tasks.filter(x => x.id !== id);
      save(); render(); toast('تم حذف المهمة');
    });
  }
  if (act === 'day-pick') { modalRoot.querySelector('#f-due').value = a.dataset.d; refreshDayStrip(); }
  if (act === 'fweek') { formWeek += +a.dataset.n; refreshDayStrip(); }
  if (act === 'sugg') { const inp = modalRoot.querySelector('#f-title'); inp.value = a.dataset.v; inp.focus(); }
  if (act === 'gen-image') generateImage();
  if (act === 'lock-now') showLock();
  if (act === 'backup-copy') {
    const ta = modalRoot.querySelector('#backup-out');
    const done = () => toast('تم النسخ، الصقها في التطبيق الآخر');
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast('النص محدد، انسخه يدوياً'); }); }
    catch { ta.select(); toast('النص محدد، انسخه يدوياً'); }
  }
  if (act === 'backup-file') {
    const url = URL.createObjectURL(new Blob([modalRoot.querySelector('#backup-out').value], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url; link.download = `school-health-backup-${today()}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  if (act === 'backup-import') backupResult(importData(modalRoot.querySelector('#backup-in').value));
  if (act === 'pin-remove') { try { localStorage.removeItem(PIN_KEY); } catch {} delete memStore[PIN_KEY]; closeModal(); render(); toast('تم إلغاء القفل'); }
  if (act === 'wk-style') { weekStyle = a.dataset.v; openInfographic('week'); }
  if (act === 'print') window.print();
});

modalRoot.addEventListener('input', e => {
  if (e.target.id !== 'ig-preparer') return;
  state.preparer = e.target.value;
  savePrefs();
  const el = modalRoot.querySelector('#ig-preparer-out');

document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.innerHTML) closeModal(); });

// ---------- الإنفوجرافيك ----------
function ring(pct) {
  const r = 44, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `
    <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
      <circle cx="56" cy="56" r="${r}" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10"></circle>
      <circle cx="56" cy="56" r="${r}" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 56 56)"></circle>
      <text x="56" y="62" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700" font-family="IBM Plex Sans Arabic, Tahoma, sans-serif">${pct}%</text>
    </svg>`;
}

      </div>
      <div class="ig-body">
        <div class="ig-stats">
          <div class="ig-stat"><b class="num">${s.total}</b><small>مهام اليوم</small></div>
          <div class="ig-stat"><b class="num" style="color:#15803d">${s.done}</b><small>منجزة</small></div>
          <div class="ig-stat"><b class="num" style="color:#b54708">${s.left}</b><small>متبقية</small></div>
        </div>
        ${sec('today')}
        ${sec('progress')}
        ${sec('done')}
      </div>
      <div class="ig-foot">
        <span>المعدّ: <span id="ig-preparer-out">${esc(state.preparer.trim() || '—')}</span></span>

// تصغير المعاينة لتناسب عرض الشاشة؛ الصورة المحفوظة تبقى بحجمها الكامل
function fitPreview() {
  const frame = document.getElementById('ig-frame'), box = document.getElementById('ig-scale'), card = document.getElementById('infographic');
  if (!frame || !box || !card) return;
  box.style.transform = ''; box.style.height = '';
  const k = Math.min(1, (frame.clientWidth - 16) / card.offsetWidth);
  if (k < 1) { box.style.transform = `scale(${k})`; box.style.height = `${card.offsetHeight * k}px`; }
}
window.addEventListener('resize', fitPreview);

// نجهّز الصورة في الخلفية فور فتح نافذة التصدير، فيكون الحفظ فورياً عند الضغط
let rendered = null, renderTimer = 0;
function prerender(delay = 300) {
  rendered = null;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { rendered = renderCard(); rendered.catch(() => { rendered = null; }); }, delay);
}
async function renderCard() {
  const card = document.getElementById('infographic');
  if (!card || !window.html2canvas) throw new Error('no-tool');
  card.querySelectorAll('svg.lucide').forEach(svg => svg.setAttribute('stroke', getComputedStyle(svg).color));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  card.classList.add('capturing');
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
    onclone: doc => { const box = doc.getElementById('ig-scale'); if (box) { box.style.transform = 'none'; box.style.height = 'auto'; } } })
    .finally(() => card.classList.remove('capturing'));
  const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
  return { card, blob, url: URL.createObjectURL(blob) };
}

async function generateImage() {
  const out = document.getElementById('ig-image-out');
  if (!window.html2canvas) { toast('تعذر تحميل أداة إنشاء الصور'); return; }
  clearTimeout(renderTimer);
  const card = document.getElementById('infographic');
  if (!rendered) rendered = renderCard();
  let img;
  try {
    img = await rendered;
    if (img.card !== card) { rendered = renderCard(); img = await rendered; }
  } catch {
    rendered = null;
    toast('تعذر إنشاء الصورة، حاول مرة أخرى');
    return;
  }
  let saved = false;
  const downloads = await downloadsReady;
  if (downloads) {
    try {
      await downloads.save({ filename: exportName, data: img.blob });
      saved = true; toast('تم حفظ الصورة');
    } catch (err) {
      toast(err?.code === 'declined' ? 'تم إلغاء الحفظ' : 'تعذر الحفظ المباشر، احفظ الصورة أدناه يدوياً');
    }
  }
  if (!inFrame) {
    const a = document.createElement('a');
    a.href = img.url; a.download = exportName;
    document.body.appendChild(a); a.click(); a.remove();
    saved = true; toast('تم حفظ الصورة');
  }
  out.hidden = false;
  out.innerHTML = `
    <p class="text-sm font-semibold muted mb-2">${saved ? 'تم حفظ الصورة. يمكنك أيضاً حفظ النسخة أدناه يدوياً.'
      : 'الصورة جاهزة: اضغط عليها مطولاً (في الجوال) أو انقر بالزر الأيمن واختر «حفظ الصورة».'}</p>
    <img src="${img.url}" alt="بطاقة التصدير" style="width:100%;max-width:520px;border-radius:14px;border:1px solid var(--line)">`;
}

// ---------- الأحداث ----------
function newTask(type) {
  return { id: uid(), type, title: '', desc: '', grades: [], priority: 'normal', due: today(), status: 'today', prevStatus: 'today', doneAt: null, created: Date.now() };
}

app.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const act = a.dataset.action;
  const li = a.closest('li[data-id]');
  const t = li ? state.tasks.find(x => x.id === li.dataset.id) : null;
  if (act !== 'delete' && act !== 'delete-confirm') state.pendingDelete = null;

  if (act === 'school') { state.school = a.dataset.id; savePrefs(); load(); render(); }
  if (act === 'add') openForm(newTask(a.dataset.type));
  if (act === 'add-on') openForm({ ...newTask('custom'), due: a.dataset.d });
  if (act === 'week') { weekOffset += +a.dataset.n; render(); }
  if (act === 'week-export') openInfographic('week');
  if (act === 'week-now') { weekOffset = 0; render(); }
  if (act === 'infographic') openInfographic();
  if (act === 'lock-menu') openLockMenu();
  if (act === 'backup') openBackup();
  if (act === 'sample') loadSample();
  if (act === 'toggle' && t) {
    setStatus(t, t.status === 'done' ? (t.prevStatus || 'today') : 'done');
    save(); render();
    if (t.status === 'done') toast('أحسنت، نُقلت المهمة إلى المنجزة');
  }
  if (act === 'move' && t) { setStatus(t, a.dataset.to); save(); render(); }
  if (act === 'edit' && t) openForm(t);
  if (act === 'delete' && t) {
    state.pendingDelete = t.id; render();
    setTimeout(() => { if (state.pendingDelete === t.id) { state.pendingDelete = null; render(); } }, 4000);
  }
  if (act === 'delete-confirm' && t) {
    state.tasks = state.tasks.filter(x => x !== t);
    state.pendingDelete = null;
    save(); render(); toast('تم حذف المهمة');
  }
  if (act === 'clear-done') {
    const n = state.tasks.filter(x => x.status === 'done').length;
    openConfirm('حذف المهام المنجزة؟', `سيتم حذف ${n} ${n === 1 ? 'مهمة منجزة' : 'مهام منجزة'} من ${esc(SCHOOLS.find(s => s.id === state.school).short)} نهائياً.`, 'حذف', () => {
      state.tasks = state.tasks.filter(x => x.status !== 'done');
      save(); render(); toast('تم حذف المهام المنجزة');
    });
  }
});

let toastTimer;
function toast(msg) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (root.innerHTML = ''), 2200);
}

function loadSample() {
  const d = today();
  // تكييف صفوف المثال مع صفوف المدرسة الحالية
  const sg = list => list.every(g => schoolGrades().includes(g)) ? list : schoolGrades().slice(0, list.length);
  const mk = o => ({ ...newTask(o.type || 'custom'), ...o, grades: sg(o.grades || []), id: uid() });

// ---------- القفل برمز سري (على هذا الجهاز فقط) ----------
const hasPin = () => !!store.get(PIN_KEY, null);
async function hashPin(pin) {
  const text = 'shp-pin:' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'f' + (h >>> 0).toString(16);
  }
}

lockRoot.dir = 'rtl'; lockRoot.lang = 'ar';
document.body.appendChild(lockRoot);

// ---------- نقل البيانات: نسخة احتياطية تُنقل بين الأجهزة والروابط ----------
function exportData() {
  const tasks = {};
  SCHOOLS.forEach(sc => { tasks[sc.id] = sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []); });
  return JSON.stringify({ app: 'school-health-planner', v: 2, at: new Date().toISOString(), preparer: state.preparer, tasks });
}

function importData(text) {
  let data;
  try { data = JSON.parse(text.trim()); } catch { return 'النص ليس نسخة احتياطية صحيحة. تأكد أنك نسخته كاملاً.'; }
  if (!data || data.app !== 'school-health-planner' || typeof data.tasks !== 'object') return 'هذه ليست نسخة احتياطية من هذا التطبيق.';
  let added = 0, updated = 0;
  SCHOOLS.forEach(sc => {
    const incoming = Array.isArray(data.tasks[sc.id]) ? data.tasks[sc.id] : [];
    const current = sc.id === state.school ? state.tasks : store.get(tasksKey(sc.id), []);
    const byId = new Map(current.map(t => [t.id, t]));
    incoming.forEach(t => { if (!t || !t.id) return; byId.has(t.id) ? updated++ : added++; byId.set(t.id, t); });
    store.set(tasksKey(sc.id), [...byId.values()]);
  });
  if (data.preparer && !state.preparer) { state.preparer = data.preparer; savePrefs(); }
  load(); render();
  return { added, updated };
}

// ---------- الحركة: GSAP + ScrollTrigger مع Lenis، ومكوّنات منقولة من React Bits ----------
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasGsap = !!(window.gsap && window.ScrollTrigger);
if (hasGsap) gsap.registerPlugin(ScrollTrigger);

// Lenis يتحرك على نبض GSAP نفسه، وScrollTrigger يتحدّث مع كل تمرير
let lenis = null;
if (hasGsap && window.Lenis && !reduceMotion) {
  lenis = new Lenis({ duration: 1.1, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(time => lenis.raf(time * 1000));
  gsap.ticker.lagSmoothing(0);
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
let firstPaint = true;
const lastCounts = {};

function afterRender() {
  mountRays();
  if (!hasGsap || reduceMotion) { firstPaint = false; return; }
  countUp();
  if (firstPaint) { blurText(document.getElementById('hero-title')); revealSections(); }
  else ScrollTrigger.getAll().forEach(t => t.kill());
  firstPaint = false;
}

// Blur Text (React Bits): كل كلمة تنزل من ضبابية إلى وضوح
function blurText(el, { delay = 0.2, step = 0.35 } = {}) {
  if (!el) return;
  el.innerHTML = el.textContent.trim().split(/\s+/).map(w => `<span class="blur-word">${esc(w)}</span>`).join(' ');
  el.querySelectorAll('.blur-word').forEach((w, i) => {
    gsap.timeline({ delay: 0.15 + i * delay })
      .fromTo(w, { filter: 'blur(10px)', opacity: 0, y: -40 }, { filter: 'blur(5px)', opacity: 0.5, y: 5, duration: step, ease: 'none' })
      .to(w, { filter: 'blur(0px)', opacity: 1, y: 0, duration: step, ease: 'power1.out', clearProps: 'filter,will-change' });
  });
}

// ظهور ناعم لكل قسم عند الوصول إليه أثناء التمرير (مرة واحدة)
function revealSections() {
  gsap.from('.hero', { y: 14, autoAlpha: 0, duration: 0.8, ease: 'power2.out' });
  const els = ['.actions', '.quote', '.tabs', '.progress-card', 'header > .flex:last-child', 'main > .column', 'section[aria-labelledby="up-h"]']
    .flatMap(sel => [...document.querySelectorAll(sel)]);
  els.forEach((el, i) => gsap.from(el, {
    y: 22, autoAlpha: 0, duration: 0.8, ease: 'power2.out', delay: el.matches('main > .column') ? (i % 3) * 0.08 : 0,
    scrollTrigger: { trigger: el, start: 'top 92%', once: true },
  }));  // Tailwind والخطوط تغيّر المقاسات بعد أول رسم، فنعيد حساب نقاط الظهور
  setTimeout(() => ScrollTrigger.refresh(), 350);
  if (document.fonts) document.fonts.ready.then(() => ScrollTrigger.refresh());
}

// الأرقام تعدّ من قيمتها السابقة إلى الجديدة
function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const key = el.dataset.key, to = Number(el.dataset.count), from = lastCounts[key] ?? 0;
    lastCounts[key] = to;
    if (from === to) return;
    const o = { v: from };
    el.textContent = from;
    gsap.to(o, { v: to, duration: 1.1, ease: 'power2.out', onUpdate: () => { el.textContent = Math.round(o.v); } });
  });
  const bar = document.querySelector('#day-bar > span');
  if (bar) {
    const to = parseFloat(bar.style.width) || 0, from = lastCounts.bar ?? 0;
    lastCounts.bar = to;
    if (from !== to) gsap.fromTo(bar, { width: `${from}%` }, { width: `${to}%`, duration: 1.1, ease: 'power2.out' });
  }
}

// Light Rays (React Bits) بـ WebGL مباشرة: أشعة من أعلى الهيدر بالأخضر الزيتي والذهبي
const rays = (() => {
  const canvas = document.createElement('canvas');
  canvas.className = 'rays';
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false });
  if (!gl) return null;
  const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = `precision highp float;
    uniform float iTime; uniform vec2 iResolution; uniform vec3 colA; uniform vec3 colB;
    const float spread = 1.0, rayLength = 2.0, fadeDistance = 1.1, distortion = 0.08;
    float rayStrength(vec2 src, vec2 dir, vec2 coord, float seedA, float seedB, float speed) {
      vec2 d = coord - src; vec2 n = normalize(d);
      float a = dot(n, dir) + distortion * sin(iTime * 2.0 + length(d) * 0.01) * 0.2;
      float spreadF = pow(max(a, 0.0), 1.0 / spread);
      float dist = length(d);
      float lenF = clamp((iResolution.x * rayLength - dist) / (iResolution.x * rayLength), 0.0, 1.0);
      float fadeF = clamp((iResolution.x * fadeDistance - dist) / (iResolution.x * fadeDistance), 0.5, 1.0);
      float base = clamp((0.45 + 0.15 * sin(a * seedA + iTime * speed)) + (0.3 + 0.2 * cos(-a * seedB + iTime * speed)), 0.0, 1.0);
      return base * lenF * fadeF * spreadF;
    }
    void main() {
      vec2 coord = vec2(gl_FragCoord.x, iResolution.y - gl_FragCoord.y);
      vec2 src = vec2(iResolution.x * 0.5, -iResolution.y * 0.2);
      float r1 = rayStrength(src, vec2(0.0, 1.0), coord, 36.2214, 21.11349, 0.45);
      float r2 = rayStrength(src, vec2(0.0, 1.0), coord, 22.3991, 18.0234, 0.33);
      float fade = 1.0 - coord.y / iResolution.y;
      float a = clamp((r1 * 0.5 + r2 * 0.4) * (0.35 + fade * 0.65), 0.0, 1.0);
      vec3 col = mix(colA, colB, clamp(r2 / max(r1 + r2, 0.001), 0.0, 1.0) * 0.6);
      gl_FragColor = vec4(col, a);
    }`;
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const u = n => gl.getUniformLocation(prog, n);
  gl.uniform3f(u('colA'), 15 / 255, 118 / 255, 110 / 255);   // --accent
  gl.uniform3f(u('colB'), 217 / 255, 154 / 255, 30 / 255);   // --gold
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  let visible = true, raf = 0;
  const t0 = performance.now();
  const draw = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (!w || !h) return;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform2f(u('iResolution'), w, h);
    gl.uniform1f(u('iTime'), reduceMotion ? 4 : (performance.now() - t0) / 1000);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  const loop = () => { raf = 0; if (!visible || document.hidden) return; draw(); raf = requestAnimationFrame(loop); };
  const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !reduceMotion && !raf) loop(); });
  return {
    mount(host) {
      if (canvas.parentNode !== host) host.prepend(canvas);
      io.disconnect(); io.observe(host);
      requestAnimationFrame(() => (reduceMotion ? draw() : (!raf && loop())));
    },
  };
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) mountRays(); });
function mountRays() { const hero = document.querySelector('.hero'); if (rays && hero) rays.mount(hero); }

load();
if (hasPin()) showLock(); else render();
window.addEventListener('load', refreshIcons);
</script>

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
